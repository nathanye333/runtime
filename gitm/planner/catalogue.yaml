# Vendor GPU peak catalogue (schema only — not loaded by code yet).
#
# Roadmap target for HardwareSpec (see gitm/planner/roofline.py). When wired,
# rows here replace the handwritten tables in gitm/planner/context.py
# (_PEAKS, _QUANT_PEAKS, _INTERCONNECT, _ARCH, _MEMORY).
#
# Units match the ceiling / roofline layer (do not use nanoseconds here):
#   peak_flops_*_per_s          FLOP/s
#   hbm_bw_bytes_per_s          bytes/s
#   hbm_capacity_bytes          bytes
#   interconnect_bw_bytes_per_s bytes/s (NVLink or PCIe, bidirectional per GPU)
#   sm_count                    count (ticket-forward; unused by roofline today)
#   l2_bytes                    bytes (ticket-forward; unused by roofline today)
#   arch                        tensor-core generation string (hopper, blackwell, …)
#   source                      datasheet citation
#
# Traces and signal contracts use nanoseconds elsewhere; convert at compare time
# (ns / 1e9 → s) when calibrating against t_pred_s.
#
# Other SKUs: leave null until datasheet fill. H200 SXM is filled from the same
# dense figures as gitm/planner/context.py (ceiling source of truth today).

skus:
  - sku: A100
    peak_flops_fp16_per_s: null
    peak_flops_fp8_per_s: null
    peak_flops_fp4_per_s: null
    peak_flops_fp32_per_s: null
    hbm_bw_bytes_per_s: null
    hbm_capacity_bytes: null
    interconnect_bw_bytes_per_s: null
    arch: null
    sm_count: null
    l2_bytes: null
    source: ""

