# Vendor GPU peak catalogue (schema + datasheet values — not loaded by code yet).
#
# Roadmap target for HardwareSpec (see gitm/planner/roofline.py). When wired,
# rows here replace the handwritten tables in gitm/planner/context.py
# (_PEAKS, _QUANT_PEAKS, _INTERCONNECT, _ARCH, _MEMORY). Until then, context.py
# remains the runtime source of truth (note: GB200 dense FP16 there is 2250e12
# by deliberate conservatism; this catalogue stores the datasheet per-GPU 2500e12).
#
# ---------------------------------------------------------------------------
# Field semantics (read before wiring into the planner)
# ---------------------------------------------------------------------------
# peak_flops_*_per_s
#   Dense theoretical peak FLOP/s. NO 2:4 structured sparsity.
#   When a datasheet lists sparse|dense or footnotes "*", catalogue = dense
#   (= half of the sparse marketing cell).
#   peak_flops_fp32_per_s = CUDA-core / non-tensor FP32 (e.g. MoE router),
#   NOT Tensor Core TF32 (TF32 on H100 SXM is ~989 TFLOPS dense — separate path).
#   FP16 and BF16 Tensor Core rates are identical on these SKUs; only fp16 is
#   stored (HardwareSpec copies into bf16 today).
#
# hbm_bw_bytes_per_s / hbm_capacity_bytes
#   Nominal vendor peaks. Capacity uses decimal 1e9 bytes per advertised "GB"
#   (80e9 for "80 GB"), not GiB. Not guaranteed usable after ECC/BAR/driver.
#
# interconnect_bw_bytes_per_s
#   Theoretical aggregate bidirectional bandwidth for ONE GPU's primary
#   scale-up link (NVLink total or PCIe Gen4 x16). NOT effective collective
#   bandwidth, NOT per-link unidirectional, and NOT fabric-equivalent across
#   NVLink vs PCIe — L40S is PCIe-only (no NVLink).
#
# l2_bytes
#   Binary MiB → bytes (40 MiB = 40 * 2^20). Do not mix with decimal "MB".
#
# sm_count
#   NVIDIA Streaming Multiprocessors (vendor-specific name).
#
# sku_variant
#   Form factor the numbers belong to (SXM vs PCIe). Do not apply an SXM row
#   to a PCIe part (H100 PCIe has lower peaks and different HBM BW).
#
# GB200 row
#   One Blackwell GPU inside a GB200 system (per-GPU peaks / HBM / NVLink),
#   NOT the Grace–Blackwell Superchip aggregate and NOT NVL72 rack totals.
#
# B200 HBM bandwidth
#   7.7 TB/s from HGX B200 datasheet (NVIDIA doc 3384703). HGX RA text also
#   says "up to 8 TB/s"; we keep 7.7 to match context.py and the cited sheet.
#   GB200 GPU uses 8.0 TB/s (doc 4204213).
#
# null peak + sources note "n/a" = SKU has no native tensor path at that dtype.
# Traces use nanoseconds elsewhere; convert at compare time (ns / 1e9 → s).
#
# Manual verification links are listed under each row's sources and in the
# docs/sku_constant_inventory.md companion note.

