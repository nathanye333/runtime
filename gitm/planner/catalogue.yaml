    peak_flops_fp8_per_s: 1979e12
    peak_flops_fp4_per_s: null  # Hopper: no FP4 tensor path
    peak_flops_fp32_per_s: 67e12
    hbm_bw_bytes_per_s: 4800e9
    hbm_capacity_bytes: 141e9
    interconnect_bw_bytes_per_s: 900e9
    arch: hopper
    sm_count: 132
    l2_bytes: 52428800  # 50 MiB (Hopper "50 MB" = binary)
    source: "NVIDIA H200 SXM; dense figures as in gitm/planner/context.py (_PEAKS/_QUANT_PEAKS/_INTERCONNECT/_MEMORY); https://www.nvidia.com/en-us/data-center/h200/"

